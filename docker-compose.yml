# Serves both Angular build targets behind nginx.
# The backend microservices already run in the external compose network
# `agro_trade_default`; this file attaches to it rather than creating its own.
# Upstream hosts are overridable via the *_HOST env vars (defaults below point
# at the real backend container names on that network).

services:
  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: agro_trade_frontend
    image: agro-trade/storefront:latest
    ports:
      - "3000:80"
    environment:
      API_HOST: ${API_HOST:-agro_trade-web-1:8080}
      CHAT_HOST: ${CHAT_HOST:-chat_service:8081}
      DOCUMENT_HOST: ${DOCUMENT_HOST:-document-service:8083}
      BANKING_HOST: ${BANKING_HOST:-banking_service_app:8084}
      SOCKET_HOST: ${SOCKET_HOST:-agro_trade-web-1:9093}
    networks: [agro_trade_default]
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: agro_trade_admin
    image: agro-trade/admin:latest
    ports:
      - "8090:80"
    environment:
      API_HOST: ${API_HOST:-agro_trade-web-1:8080}
      CHAT_HOST: ${CHAT_HOST:-chat_service:8081}
      DOCUMENT_HOST: ${DOCUMENT_HOST:-document-service:8083}
      BANKING_HOST: ${BANKING_HOST:-banking_service_app:8084}
      SOCKET_HOST: ${SOCKET_HOST:-agro_trade-web-1:9093}
    networks: [agro_trade_default]
    restart: unless-stopped

# Backends run in another compose project ("agro_trade"); attach to its
# existing network instead of creating a new one.
networks:
  agro_trade_default:
    external: true
    name: agro_trade_default
